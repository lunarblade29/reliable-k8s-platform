apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: 'order-service'
        static_configs:
          - targets: ['order-service.default.svc.cluster.local:5000']
      - job_name: 'payment-service'
        static_configs:
          - targets: ['payment-service.default.svc.cluster.local:5001']
